<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/Gato_Usu_RS.png">    
    <link rel="stylesheet" href="css/basico.css">
    <link rel="stylesheet" href="css/ranking.css">
    <title>Whack a Cato - Ranking</title>
</head>

<body>
    <header>
        <hr>
    </header>

    <section class="tela-meio">
        <div class="tela-header">
            <div class="botao-voltar">
                <a href="telaprincipal.html">
                    <img src="img/Botão_Voltar_Verde_RS.png" alt="botao-voltar">
                </a>
            </div>

            <div class="title-ranking">
                <div class="estrela">
                    <img src="img/Estrela_RS.png" alt="estrela">
                </div>

                <div class="title">
                    <h1>Ranking</h1>
                </div>

                <div class="estrela">
                    <img src="img/Estrela_RS.png" alt="estrela">
                </div>
            </div>
        </div>

        <div class="titles">
            <h2>Tabuleiro</h2>
            <h2>Modalidade</h2>
            <h2>Pontuação</h2>
            <h2>Nível</h2>
        </div>

        <div class="cards-ranking">
            <div class="cards">
                <div class="card">
                    <h3 class="posicao">1°</h3>
                    <h3 class="usuario">Maria123</h3>
                </div>
                <div class="especificacoes">
                    <h3 class="tabuleiro">4x4</h3>
                    <h3 class="modalidade">Explosiva</h3>
                    <h3 class="pontuacao">5000</h3>
                    <h3 class="nivel">50</h3>
                </div>
            </div>

            <div class="cards">
                <div class="card">
                    <h3 class="posicao">2°</h3>
                    <h3 class="usuario">AnaClara2</h3>
                </div>
                <div class="especificacoes">
                    <h3 class="tabuleiro">4x4</h3>
                    <h3 class="modalidade">Clássica</h3>
                    <h3 class="pontuacao">4550</h3>
                    <h3 class="nivel">40</h3>
                </div>
            </div>

            <div class="cards">
                <div class="card">
                    <h3 class="posicao">3°</h3>
                    <h3 class="usuario">João_Vitor2</h3>
                </div>
                <div class="especificacoes">
                    <h3 class="tabuleiro">3x3</h3>
                    <h3 class="modalidade">Clássica</h3>
                    <h3 class="pontuacao">3337</h3>
                    <h3 class="nivel">32</h3>
                </div>
            </div>

            <div class="cards">
                <div class="card">
                    <h3 class="posicao">4°</h3>
                    <h3 class="usuario">Mel1515</h3>
                </div>
                <div class="especificacoes">
                    <h3 class="tabuleiro">4x4</h3>
                    <h3 class="modalidade">Explosiva</h3>
                    <h3 class="pontuacao">3150</h3>
                    <h3 class="nivel">30</h3>
                </div>
            </div>

            <div class="cards">
                <div class="card">
                    <h3 class="posicao">5°</h3>
                    <h3 class="usuario">S4r4h_</h3>
                </div>
                <div class="especificacoes">
                    <h3 class="tabuleiro">2x2</h3>
                    <h3 class="modalidade">Clássica</h3>
                    <h3 class="pontuacao">2400</h3>
                    <h3 class="nivel">19</h3>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <hr>
    </footer>
</body>

</html>
