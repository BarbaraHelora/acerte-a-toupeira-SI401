<!DOCTYPE html>
    <html lang="pt">
        <head> 
            <title>Whack a Cato - Login</title>
            <link rel="icon" href="img/Gato_Usu_RS.png">
            <link rel="stylesheet" href="css/basico.css">
            <link rel="stylesheet" href="css/login.css">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta charset="UTF-8">
        </head>

        <body>
            <div class="meio"> 
                <div class="conteudo">
                    <img src="img/Gato_Usu_RS.png" alt="Gato">

                    <form name="formLogin" action="telaprincipal.html" method="GET"> <!-- por enquanto GET para teste -->
                        <div class="login">
                            <h1>Whack a Cato</h1>

                            <label for="usuario">Usuário</label>
                            <input type="text" id="usuario" name="usuario" required>
                        
                            <label for="senha"> Senha</label>
                            <input type="password" id="senha" name="senha" required>

                            <input type="submit" class="botao-login" value="Login">
                    </form>

                        <p id="cadastro">
                            Não tem uma conta? <a href="cadastro.html">Cadastre-se!</a>
                        </p>
                    </div>
                </div>
            </div>

        <script src="js/validacoes.js"></script>

        </body>
    </html>
