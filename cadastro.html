<!DOCTYPE html>
    <html lang="pt">
        <head>
            <title>Whack a Cato - Cadastro</title>
            <link rel="icon" href="img/Gato_Usu_RS.png">
            <link rel="stylesheet" href="css/basico.css">
            <link rel="stylesheet" href="css/cadastro.css">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta charset="UTF-8">
        </head>

        <body>
            <div class="meio">
                <a class="botao-voltar" href="login.html">
                    <img src="img/Botão_Voltar_Marrom_RS.png" alt="Voltar">
                </a>

                <form name="formsCadastro" action="login.html" onsubmit="return validarCadastro()" method="GET"> <!-- por enquanto GET para teste -->
                    <div class="topo-cadastro">
                            <img src="img/Gato_Usu_RS.png" alt="Gato">

                            <div class="campos-superiores">
                            <h1>Cadastro</h1>

                            <label for="nome">Nome Completo</label>
                            <input type="text" id="nome" name="nome" required>

                            <label for="dataNascimento">Data de Nascimento</label>
                            <input type="date" id="dataNascimento" name="dataNascimento" required>

                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>
                        </div>
                    </div>

                    <div class="base-cadastro">
                        <div class="coluna-esquerda">
                            <label for="usuario">Nome de Usuário</label>
                            <input type="text" id="usuario" name="usuario" required>

                            <label for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" required>
                        </div>

                        <div class="coluna-direita">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" maxlength="15" placeholder="(99) 99999-9999" required>

                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="usuario@email.com" required>
                        </div>
                    </div>

                    <input type="submit" class="botao-cadastrar" value="Cadastrar">               
                 </form>
            </div>

            <script src="js/validacoes.js"></script>

        </body>
    </html>
