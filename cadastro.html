<!DOCTYPE html>
    <html lang="pt">
        <head>
            <title>Whack a Cato - Cadastro</title>
            <link rel="stylesheet" href="css/basico.css">
            <link rel="stylesheet" href="css/cadastro.css">
            <meta charset="UTF-8">
        </head>

        <body>
            <div class="meio">
                <a class="botao-voltar" href="login.html">
                    <img src="img/Botão_Voltar_Marrom_RS.png" alt="Voltar">
                </a>

                <div class="topo-cadastro">
                    <div>
                        <img src="img/Gato_Usu_RS.png" alt="Gato">
                    </div>

                    <div class="campos-superiores">
                        <h1>Cadastro</h1>

                        <label>Nome Completo</label>
                        <input type="text">

                        <label>Data de Nascimento</label>
                        <input type="text">

                        <label>CPF</label>
                        <input type="text">
                    </div>
                </div>

                <div class="base-cadastro">
                    <div class="coluna-esquerda">
                        <label>Nome de Usuário</label>
                        <input type="text">

                        <label>Senha</label>
                        <input type="password">
                    </div>

                    <div class="coluna-direita">
                        <label>Telefone</label>
                        <input type="text">

                        <label>E-mail</label>
                        <input type="text">
                    </div>
                </div>

                <a class="botao-cadastrar" href="telaprincipal.html">Cadastrar</a>
            </div>
        </body>

    </html>
