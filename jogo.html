<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title> Whack a Cato - Jogo </title>
        <link rel="icon" href="img/Gato_Usu_RS.png">
        <link rel="stylesheet" href="css/basico.css">
        <link rel="stylesheet" href="css/jogo.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
    </head>
    <body>
        <header>
            <div class="menu-geral"></div>
            <hr>
        </header>
        <br><br><br>
        <div class="meio">
            <canvas style="background-color: black;" id="meuCanvas" width="1024" height="512"></canvas>
        </div>
        <a href="#" id="abrir-modal-ganhar"> <!--O id aqui é para o js identificar qual modal vai ser aberto, não tem a ver com o css-->
            <img id="botao-generico" src="img/Botão_Genérico_RS.png" alt="botao-jogar">
        </a>
        <a href="#" id="abrir-modal-perder"> <!--O id aqui é para o js identificar qual modal vai ser aberto, não tem a ver com o css-->
            <img id="botao-generico" src="img/Botão_Genérico_RS.png" alt="botao-jogar">
        </a>

        <dialog id="modal-ganhar">
                <img id="bandeira" src="img/Bandeira_RS.png" alt="bandeirinha">
                <div class="caixa-modal">
                    <h1> Resumo </h1>
                    <div class="modal-menu">
                        <img src="img/Gato_Estrela_RS.png" alt="gato-estrela">
                        <div class="info">
                            <div class="linha">
                                <span>Pontuação:</span>
                                <span class="num-estat" id="pontuacao"> 0 </span>
                            </div>
                            <div class="linha">
                                <span>Acertos:</span>
                                <span class="num-estat" id="acertos"> 0 </span>
                            </div>
                            <div class="linha">
                                <span>Pontuação Acumulada:</span>
                                <span class="num-estat" id="pontuacao-acul"> 0 </span>
                            </div>
                            <div class="meta-linha">
                                <span>Pontuação mínima para o próximo nível:</span>
                                <strong id="pontuacao-prox"> 0 </strong>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-botoes">
                    <a href="telaprincipal.html">
                        <img class="botao" src="img/Botão_Genérico_RS.png" alt="botao-voltar">
                    </a>
                    <a href="jogo.html">
                        <img class="botao" src="img/Botão_Genérico_RS.png" alt="botao-prox-nivel">
                    </a>
                </div>
        </dialog>
        <dialog id="modal-perder">
                <img id="bandeira" src="img/Bandeira_RS.png" alt="bandeirinha">
                <div class="caixa-modal">
                    <h1> Resumo </h1>
                    <div class="modal-menu">
                        <img src="img/Gato_Pendurado_RS.png" alt="gato-pendurado">
                        <div class="info">
                            <div class="linha">
                                <span>Pontuação:</span>
                                <span class="num-estat" id="pontuacao"> 0 </span>
                            </div>
                            <div class="linha">
                                <span>Acertos:</span>
                                <span class="num-estat" id="acertos"> 0 </span>
                            </div>
                            <div class="linha">
                                <span>Total de Gatos Acertados:</span>
                                <span class="num-estat" id="gatos-acertados"> 0 </span>
                            </div>
                            <div class="meta-linha">
                                <span>Pontuação Acumulada::</span>
                                <strong id="pontuacao-acul"> 0 </strong>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-botoes">
                    <a href="telaprincipal.html">
                        <img class="botao" src="img/Botão_Genérico_RS.png" alt="botao-voltar">
                    </a>
                    <a href="jogo.html">
                        <img class="botao" src="img/Botão_Genérico_RS.png" alt="botao-prox-nivel">
                    </a>
                </div>
        </dialog>
       
        <br><br><br>
        <footer>
            <hr>
        </footer>
        <script src="js/modais.js"></script>
    </body>
</html>
